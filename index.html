<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge Collections</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css" integrity="sha384-1vdNCNel6Tx/NQa8IR1mGOGKsbGreCkOPfbtPPnUURJ5Tu2PRVfQ/7KLZC+Pi1p1" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/github.min.css" />
    <link rel="stylesheet" href="./styles.aac6e23aaf2d.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js" integrity="sha384-ycJ6GAwiS15LoUPipwJOrWTvkUHl/YqELValBwI5I4awP1EeEQJYarj+w85ntcz7" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked@18.0.7/lib/marked.umd.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.7/dist/purify.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"></script>
    <script defer src="./index-data.710fdd53f8f4.js"></script>
    <script defer src="./app.dfd7a80c2d2d.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">KNOWLEDGE COLLECTIONS</p>
          <h1>Knowledge for Questions, Papers, Articles, Coding, and Repositories.</h1>
          <p class="subtitle zh-subtitle">问答、论文、文章、编程题与代码仓库知识库。</p>
        </div>
        <div class="metric"><strong id="record-count">0</strong><span>Entries</span></div>
      </header>

      <section class="panel" aria-labelledby="topics-heading">
        <div class="section-heading">
          <div><p class="eyebrow taxonomy-eyebrow">知识库分类</p><h2 id="topics-heading">Knowledge Collections Taxonomy</h2></div>
          <button id="clear-filter" class="text-button" type="button">Clear filters</button>
        </div>
        <div class="collection-toolbar">
          <div id="collection-filter" class="collection-filter" aria-label="Filter by collection"></div>
          <div class="tag-language-control" aria-label="Tag display language">
            <div class="tag-language-switch">
              <button type="button" data-tag-language="en" aria-pressed="true">English Tags</button>
              <button type="button" data-tag-language="zh" aria-pressed="false">中文标签</button>
            </div>
          </div>
        </div>
        <label class="search-field">
          <input id="tag-search" type="search" aria-label="Search questions or tags by key, Chinese name, English name, or alias" placeholder="Search questions, tags, or aliases…" autocomplete="off" />
        </label>
        <div class="taxonomy-filters">
          <div class="taxonomy-row" data-taxonomy-row="domains"><div class="taxonomy-label"><strong>Domain</strong><span class="zh-taxonomy">领域</span></div><div id="domain-filter" class="taxonomy-options"></div></div>
          <div class="taxonomy-row" data-taxonomy-row="topics"><div class="taxonomy-label"><strong>Topic</strong><span class="zh-taxonomy">主题</span></div><div id="topic-filter" class="taxonomy-options"></div></div>
          <div class="taxonomy-row" data-taxonomy-row="concepts"><div class="taxonomy-label"><strong>Concept</strong><span class="zh-taxonomy">概念</span></div><div id="concept-filter" class="taxonomy-options"></div></div>
          <div class="taxonomy-row" data-taxonomy-row="keywords"><div class="taxonomy-label"><strong>Keyword</strong><span class="zh-taxonomy">关键词</span></div><div id="keyword-filter" class="taxonomy-options"></div></div>
          <div class="taxonomy-row" data-taxonomy-row="impacts"><div class="taxonomy-label"><strong>Impact</strong><span class="zh-taxonomy">影响力</span></div><div id="impact-filter" class="taxonomy-options"></div></div>
          <div class="taxonomy-row" data-taxonomy-row="publications"><div class="taxonomy-label"><strong>Publication</strong><span class="zh-taxonomy">期刊会议</span></div><div id="publication-filter" class="taxonomy-options"></div></div>
          <div class="taxonomy-row" data-taxonomy-row="difficulties"><div class="taxonomy-label"><strong>Difficulty</strong><span class="zh-taxonomy">难度</span></div><div id="difficulty-filter" class="taxonomy-options"></div></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="questions-heading">
        <div class="section-heading"><div><p class="eyebrow zh-eyebrow">知识库</p><h2 id="questions-heading">Knowledge Collections</h2></div><span id="active-filter" class="active-filter">Entries</span></div>
        <div id="qa-list" class="qa-list"></div>
        <nav id="pagination" class="pagination" aria-label="Knowledge pages"></nav>
      </section>
    </main>
  </body>
</html>
